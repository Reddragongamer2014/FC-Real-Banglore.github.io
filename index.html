<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Real Banglore - Official Club Page</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --accent: #f59e0b;
            --bg: #0b1329;
            --card-bg: #162038;
            --stat-bg: #0d162d;
            --text: #ffffff;
            --text-muted: #8e9bb0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #1f2d4d;
        }

        /* Navigation Links */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 1px solid #1f2d4d;
            padding-bottom: 15px;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .nav-link.active, .nav-link:hover {
            color: var(--text);
            background: var(--secondary);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-container {
            width: 160px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.8);
            border: 3px solid var(--secondary);
            overflow: hidden;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .club-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .established {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--stat-bg);
            border-radius: 12px;
            padding: 25px 10px;
            text-align: center;
            border: 1px solid #1a2744;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            border-left: 4px solid var(--secondary);
            padding-left: 10px;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
        }

        .player-card {
            background: var(--stat-bg);
            border: 1px solid #1a2744;
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s ease, border-color 0.2s ease;
            text-decoration: none;
        }

        .player-card:hover {
            transform: translateY(-3px);
            border-color: var(--secondary);
        }

        .jersey-number {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--secondary);
            background: rgba(59, 130, 246, 0.1);
            width: 45px;
            height: 45px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(59, 130, 246, 0.3);
            flex-shrink: 0;
        }

        .player-info {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
        }

        .player-position {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .players-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Navigation -->
        <nav class="nav-tabs">
            <a href="index.html" class="nav-link active">Club Overview</a>
            <a href="profile.html" class="nav-link">My Profile</a>
        </nav>

        <header class="header">
            <div class="logo-container">
                <img src="your-logo-path.png" alt="FC Real Banglore Logo">
            </div>
            <h1 class="club-title">FC Real Banglore</h1>
            <p class="established">EST. SEPTEMBER 27, 2026</p>
        </header>

        <!-- Dynamic Stats Grid -->
        <section class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="stat-value">...</div><div class="stat-label">Loading</div></div>
        </section>

        <!-- Dynamic Players Section -->
        <div class="section-title">Squad Roster</div>
        <section class="players-grid" id="playersGrid">
            <div class="stat-card"><div class="stat-value">...</div><div class="stat-label">Loading Roster</div></div>
        </section>
    </div>

    <script>
        const SPREADSHEET_ID = '14HtRxp6DR0sfS1f2fckOqApIu10WrsKvbIDcBIAnziA';
        const STATS_CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Stats`;
        const PLAYERS_CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Players`;

        async function fetchCSV(url) {
            const response = await fetch(url);
            const text = await response.text();
            return text.trim().split('\n').map(row => 
                row.split(',').map(cell => cell.replace(/^"(.*)"$/, '$1').trim())
            );
        }

        async function loadStats() {
            try {
                const rows = await fetchCSV(STATS_CSV_URL);
                const container = document.getElementById('statsGrid');
                container.innerHTML = '';

                for (let i = 1; i < rows.length; i++) {
                    const [statName, value] = rows[i];
                    if (statName && value) {
                        container.innerHTML += `
                            <div class="stat-card">
                                <div class="stat-value">${value}</div>
                                <div class="stat-label">${statName}</div>
                            </div>
                        `;
                    }
                }
            } catch (err) {
                console.error("Error loading club stats:", err);
            }
        }

        async function loadPlayers() {
            try {
                const rows = await fetchCSV(PLAYERS_CSV_URL);
                const container = document.getElementById('playersGrid');
                container.innerHTML = '';

                for (let i = 1; i < rows.length; i++) {
                    const [number, name, position] = rows[i];
                    if (number && name) {
                        container.innerHTML += `
                            <a href="profile.html" class="player-card">
                                <div class="jersey-number">${number}</div>
                                <div class="player-info">
                                    <span class="player-name">${name}</span>
                                    <span class="player-position">${position || ''}</span>
                                </div>
                            </a>
                        `;
                    }
                }
            } catch (err) {
                console.error("Error loading roster:", err);
            }
        }

        loadStats();
        loadPlayers();
    </script>
</body>
</html>
