<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Real Banglore</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --accent: #f59e0b;
            --bg: #0b1329;
            --card-bg: #162038;
            --stat-bg: #0d162d;
            --text: #ffffff;
            --text-muted: #8e9bb0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #1f2d4d;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        /* Rectangular glowing container with rounded corners */
        .logo-container {
            width: 160px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 16px; /* Smooth rounded corners */
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.8);
            border: 3px solid var(--secondary);
            overflow: hidden;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .club-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .established {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .stat-card {
            background: var(--stat-bg);
            border-radius: 12px;
            padding: 25px 10px;
            text-align: center;
            border: 1px solid #1a2744;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="logo-container">
                <img src="logo.jpg" alt="FC Real Banglore Logo">
            </div>
            <h1 class="club-title">FC Real Banglore</h1>
            <p class="established">EST. SEPTEMBER 27, 2026</p>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">22</div>
                <div class="stat-label">Goals</div>
            </div>

            <div class="stat-card">
                <div class="stat-value">67</div>
                <div class="stat-label">Tackles</div>
            </div>

            <div class="stat-card">
                <div class="stat-value">21</div>
                <div class="stat-label">Nutmegs</div>
            </div>

            <div class="stat-card">
                <div class="stat-value">1</div>
                <div class="stat-label">Penalties Scored</div>
            </div>
        </section>
    </div>

</body>
</html>
