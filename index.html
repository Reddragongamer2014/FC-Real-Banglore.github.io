<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Real Banglore</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --accent: #f59e0b;
            --bg: #0b1329;
            --card-bg: #162038;
            --stat-bg: #0d162d;
            --text: #ffffff;
            --text-muted: #8e9bb0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #1f2d4d;
        }

        /* Navigation Links */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 1px solid #1f2d4d;
            padding-bottom: 15px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn.active, .nav-btn:hover {
            color: var(--text);
            background: var(--secondary);
        }

        /* Views Toggle */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Club Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-container {
            width: 160px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.8);
            border: 3px solid var(--secondary);
            overflow: hidden;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .club-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .established {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Profile Header */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid #1f2d4d;
        }

        .jersey-badge {
            width: 90px;
            height: 90px;
            border-radius: 16px;
            background: rgba(59, 130, 246, 0.1);
            border: 3px solid var(--secondary);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--secondary);
            flex-shrink: 0;
        }

        .player-meta {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 5px;
        }

        .player-role {
            font-size: 1rem;
            color: var(--secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .club-name-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Shared Grids & Sections */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--stat-bg);
            border-radius: 12px;
            padding: 25px 10px;
            text-align: center;
            border: 1px solid #1a2744;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--secondary);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            border-left: 4px solid var(--secondary);
            padding-left: 10px;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
        }

        .player-card {
            background: var(--stat-bg);
            border: 1px solid #1a2744;
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .player-card:hover {
            transform: translateY(-3px);
            border-color: var(--secondary);
        }

        .jersey-number {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--secondary);
            background: rgba(59, 130, 246, 0.1);
            width: 45px;
            height: 45px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(59, 130, 246, 0.3);
            flex-shrink: 0;
        }

        .player-info {
            display: flex;
            flex-direction: column;
        }

        .player-card-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
        }

        .player-position {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .info-card {
            background: var(--stat-bg);
            border-radius: 12px;
            padding: 15px 20px;
            border: 1px solid #1a2744;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .info-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .players-grid, .info-grid {
                grid-template-columns: 1fr;
            }
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Navigation -->
        <nav class="nav-tabs">
            <button class="nav-btn active" onclick="switchTab('clubView')">Club Overview</button>
            <button class="nav-btn" onclick="switchTab('profileView')">Owner Profile</button>
        </nav>

        <!-- VIEW 1: CLUB OVERVIEW -->
        <div id="clubView" class="tab-content active">
            <header class="header">
                <div class="logo-container">
                    <img src="logo.png" alt="FC Real Banglore Logo">
                </div>
                <h1 class="club-title">FC Real Banglore</h1>
                <p class="established">EST. SEPTEMBER 27, 2026</p>
            </header>

            <section class="stats-grid" id="statsGrid">
                <div class="stat-card"><div class="stat-value">...</div><div class="stat-label">Loading</div></div>
            </section>

            <div class="section-title">Squad Roster</div>
            <section class="players-grid" id="playersGrid">
                <div class="stat-card"><div class="stat-value">...</div><div class="stat-label">Loading Roster</div></div>
            </section>
        </div>

        <!-- VIEW 2: PLAYER PROFILE -->
        <div id="profileView" class="tab-content">
            <header class="profile-header">
                <div class="jersey-badge" id="playerJersey">#</div>
                <div class="player-meta">
                    <h1 class="player-name" id="playerName">Loading...</h1>
                    <span class="player-role" id="playerRole">...</span>
                    <span class="club-name-sub">FC Real Banglore</span>
                </div>
            </header>

            <div class="section-title">Season Statistics</div>
            <section class="stats-grid" id="profileStatsGrid">
                <div class="stat-card"><div class="stat-value">...</div><div class="stat-label">Goals</div></div>
                <div class="stat-card"><div class="stat-value">...</div><div class="stat-label">Tackles</div></div>
                <div class="stat-card"><div class="stat-value">...</div><div class="stat-label">Nutmegs</div></div>
                <div class="stat-card"><div class="stat-value">...</div><div class="stat-label">Penalties</div></div>
            </section>

            <div class="section-title">Player Details</div>
            <section class="info-grid" id="infoGrid">
                <div class="info-card"><span class="info-label">Preferred Foot</span><span class="info-value">...</span></div>
                <div class="info-card"><span class="info-label">Appearances</span><span class="info-value">...</span></div>
                <div class="info-card"><span class="info-label">Assists</span><span class="info-value">...</span></div>
                <div class="info-card"><span class="info-label">Joined Club</span><span class="info-value">...</span></div>
            </section>
        </div>
    </div>

    <script>
        // Data Source URLs
        const STATS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQTBpk0fLwmA8UleJEOWixtImU-JpM94mbJUImXw9XwD7h6R4JAc6EkFRaFHAKPv9volTIPtjrC8ms1/pub?gid=0&single=true&output=csv';
        const PLAYERS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQTBpk0fLwmA8UleJEOWixtImU-JpM94mbJUImXw9XwD7h6R4JAc6EkFRaFHAKPv9volTIPtjrC8ms1/pub?gid=935091105&single=true&output=csv';
        const PROFILE_CSV_URL = 'https://docs.google.com/spreadsheets/d/14HtRxp6DR0sfS1f2fckOqApIu10WrsKvbIDcBIAnziA/gviz/tq?tqx=out:csv&sheet=MyProfile';

        // Tab Switching Logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // CSV Fetch Helper
        async function fetchCSV(url) {
            const response = await fetch(url);
            const data = await response.text();
            return data.trim().split('\n').map(row => 
                row.split(',').map(cell => cell.replace(/^"(.*)"$/, '$1').trim())
            );
        }

        // Load Club Overview Stats
        async function loadStats() {
            try {
                const rows = await fetchCSV(STATS_CSV_URL);
                const container = document.getElementById('statsGrid');
                container.innerHTML = '';

                for (let i = 1; i < rows.length; i++) {
                    const [statName, value] = rows[i];
                    if (statName && value) {
                        container.innerHTML += `
                            <div class="stat-card">
                                <div class="stat-value">${value}</div>
                                <div class="stat-label">${statName}</div>
                            </div>
                        `;
                    }
                }
            } catch (err) {
                console.error("Error loading stats:", err);
            }
        }

        // Load Club Squad Roster
        async function loadPlayers() {
            try {
                const rows = await fetchCSV(PLAYERS_CSV_URL);
                const container = document.getElementById('playersGrid');
                container.innerHTML = '';

                for (let i = 1; i < rows.length; i++) {
                    const [number, name, position] = rows[i];
                    if (number && name) {
                        container.innerHTML += `
                            <div class="player-card" onclick="switchTab('profileView')">
                                <div class="jersey-number">${number}</div>
                                <div class="player-info">
                                    <span class="player-card-name">${name}</span>
                                    <span class="player-position">${position || ''}</span>
                                </div>
                            </div>
                        `;
                    }
                }
            } catch (err) {
                console.error("Error loading players:", err);
            }
        }

        // Load Player Profile
        async function loadProfile() {
            try {
                const rows = await fetchCSV(PROFILE_CSV_URL);
                const data = {};
                rows.forEach(row => {
                    if (row[0] && row[1]) {
                        data[row[0].toLowerCase()] = row[1];
                    }
                });

                if (data['name']) document.getElementById('playerName').innerText = data['name'];
                if (data['number']) document.getElementById('playerJersey').innerText = data['number'];
                if (data['position']) document.getElementById('playerRole').innerText = data['position'];

                document.getElementById('profileStatsGrid').innerHTML = `
                    <div class="stat-card"><div class="stat-value">${data['goals'] || 0}</div><div class="stat-label">Goals</div></div>
                    <div class="stat-card"><div class="stat-value">${data['tackles'] || 0}</div><div class="stat-label">Tackles</div></div>
                    <div class="stat-card"><div class="stat-value">${data['nutmegs'] || 0}</div><div class="stat-label">Nutmegs</div></div>
                    <div class="stat-card"><div class="stat-value">${data['penalties'] || 0}</div><div class="stat-label">Penalties</div></div>
                `;

                document.getElementById('infoGrid').innerHTML = `
                    <div class="info-card"><span class="info-label">Preferred Foot</span><span class="info-value">${data['preferred foot'] || '-'}</span></div>
                    <div class="info-card"><span class="info-label">Appearances</span><span class="info-value">${data['appearances'] || '-'}</span></div>
                    <div class="info-card"><span class="info-label">Assists</span><span class="info-value">${data['assists'] || 0}</span></div>
                    <div class="info-card"><span class="info-label">Joined Club</span><span class="info-value">${data['joined'] || '-'}</span></div>
                `;
            } catch (err) {
                console.error("Error loading profile:", err);
            }
        }

        // Initialize Data
        loadStats();
        loadPlayers();
        loadProfile();
    </script>
</body>
</html>
